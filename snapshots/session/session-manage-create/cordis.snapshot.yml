# Keyless session-manage snapshot patch: replay plus the session-manage tool
# and the Host services it calls.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: tool-session-manage
      name: '@deepseek-ai/dsh-tool-session-manage'

    - id: session-manage-file-uploads
      name: ./session-manage-host-services.mjs
