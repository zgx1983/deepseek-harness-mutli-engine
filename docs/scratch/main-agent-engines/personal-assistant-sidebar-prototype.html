function segments(items){return `<div class="segment">${items.map(([key,label])=>`<button class="${view===key?'active':''}" data-view="${key}">${label}</button>`).join('')}</div>`}
function section(key,label,items){return `<section class="section ${collapsed.has(key)?'closed':''}" data-section="${key}"><div class="section-head"><button class="section-toggle" data-collapse="${key}" aria-expanded="${!collapsed.has(key)}"><span class="caret">▾</span><h3>${label}</h3><span class="count">${items.length}</span></button>${key==='history'?'<button class="text-button" data-view="history">全部历史 →</button>':''}</div><div class="section-items">${items.length?items.slice(0,key==='history'?1:3).map(taskCard).join(''):'<p class="muted" style="font-size:12px">暂无任务</p>'}</div></section>`}
function taskCard(t){const children=t.children||[],done=children.filter(c=>c.status==='done').length;return `<article class="card"><div class="card-heading"><button class="title-link" data-task="${t.id}">${esc(t.title)}</button>${badge(t.status)}</div><div class="meta"><span class="project">${esc(t.project)}</span><span>${esc(t.engine)} · ${esc(t.model)}</span></div>${t.status==='review'?`<div class="result">${esc(t.summary)}</div>`:`<p class="muted" style="font-size:12px">${esc(t.summary)}</p>`}${children.length?`<div class="progress"><span style="width:${done/children.length*100}%"></span></div><div class="progress-label"><span>子任务 ${done}/${children.length} 已完成</span><span>${children.filter(c=>c.status==='running').length} 项执行中</span></div>`:''}<div class="card-footer"><small>${t.status==='pending'?'未创建执行会话':esc(t.updated)}</small><div style="display:flex;gap:6px">${t.executions.length?`<button class="btn ${t.status==='running'?'primary':''}" data-session="${t.executions[0].id}" data-task-owner="${t.id}">${t.status==='review'?'查看成果会话':'进入会话'} ↗</button>`:''}<button class="btn" data-task="${t.id}">${t.status==='review'?'查看与确认':'详情'}</button></div></div></article>`}
function taskList(){let items=matched(tasks);let html=search()+segments([['overview','概览'],['all','全部任务'],['history','历史']]);if(view==='overview'){return html+section('running','正在运行',items.filter(t=>t.status==='running'))+section('review','等待确认',items.filter(t=>t.status==='review'))+section('pending','待办任务',items.filter(t=>t.status==='pending'))+section('history','历史任务',items.filter(t=>['done','cancelled'].includes(t.status)))}items=items.filter(t=>view==='history'?['done','cancelled'].includes(t.status):!['done','cancelled'].includes(t.status));return html+(items.length?items.slice((page-1)*3,page*3).map(taskCard).join(''):'<div class="empty">没有符合条件的任务</div>')}
function taskDetail(t){return `<button class="back" data-back>← 返回${view==='overview'?'概览':view==='history'?'历史':'全部任务'}</button><div>${badge(t.status)}</div><h2 class="detail-title">${esc(t.title)}</h2><div class="meta"><span class="project">${esc(t.project)}</span><span>任务 ${t.id.toUpperCase()}</span></div><div class="detail-block"><h3>执行配置</h3><dl class="properties"><dt>项目</dt><dd>${esc(t.project)}</dd><dt>引擎</dt><dd>${esc(t.engine)}</dd><dt>厂商 / 模型</dt><dd>${esc(t.provider)} / ${esc(t.model)}</dd></dl></div><div class="detail-block"><h3>目标与验收</h3><p>${esc(t.goal)}</p><p class="muted" style="font-size:12px;margin-top:8px">${esc(t.criteria)}</p></div>${t.status==='review'?`<div class="result">${esc(t.summary)}<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" data-session="${t.executions[0].id}" data-task-owner="${t.id}">查看成果会话 ↗</button><button class="btn primary" data-confirm="${t.id}">${t.children.some(c=>c.status==='review')?'确认子任务成果':'确认完成'}</button></div></div>`:''}${t.children.length?`<div class="detail-block"><h3>子任务与依赖</h3>${t.children.map((c,i)=>`<div class="child"><div class="child-line"><span>${i+1}. ${esc(c.title)}</span>${badge(c.status)}</div>${c.dependency?`<div class="meta">${esc(c.dependency)}</div>`:!c.session?`<button class="btn primary" data-start-child="${t.id}" data-child-title="${esc(c.title)}">启动子任务</button>`:`<button class="btn" data-session="${c.session}" data-task-owner="${t.id}" data-child="${esc(c.title)}">进入子任务会话 ↗</button>`}</div>`).join('')}</div>`:''}<div class="detail-block"><h3>执行记录 <span class="count">${t.executions.length}</span></h3>${t.executions.length?t.executions.map(e=>`<div class="execution"><div class="execution-head"><span>${e.label}</span>${badge(e.status)}</div><div class="meta">${e.engine} · ${esc(e.model)}</div><div class="meta">开始 ${e.start}<br>结束 ${e.end}</div><button class="btn" data-session="${e.id}" data-task-owner="${t.id}">进入对应会话 ↗</button></div>`).join(''):'<p class="muted">尚未创建会话</p>'}</div>${t.status==='pending'&&!t.children.length?`<button class="btn primary" data-start="${t.id}">启动任务</button>`:''}<button class="btn" data-ask="${esc(t.title)}" style="margin-left:6px">针对任务提问</button>`}
function todoList(){const items=matched(todos).filter(t=>view==='all'||(view==='open'?t.status==='open':t.status==='done'||t.status==='converted'));return search()+segments([['open','未完成'],['all','全部'],['done','已完成 / 已转任务']])+`<div class="hint">先记下要做的事，准备好后再转换为任务。</div>`+(items.length?items.map(t=>`<div class="todo-row"><input type="checkbox" class="todo-check" data-check="${t.id}" ${t.status==='done'?'checked':''} ${t.status==='converted'?'disabled':''} aria-label="完成 ${esc(t.title)}"><div class="todo-copy"><div class="todo-title ${t.status==='done'?'finished':''}">${esc(t.title)}</div><div class="meta"><span>${esc(t.due)}</span><span>${esc(t.tag)}</span></div>${t.status==='converted'?`<button class="text-button" data-task="${t.taskId}">已转为任务 · 查看任务 →</button>`:t.status==='open'?`<button class="btn" data-convert="${t.id}">转为任务 →</button> <button class="text-button" data-ask="${esc(t.title)}">在对话中讨论</button>`:''}</div></div>`).join(''):'<div class="empty">这里暂时没有 Todo</div>')}
function noteList(){const items=matched(notes).filter(n=>view==='all'||n.kind===(view==='ideas'?'想法':'笔记'));return search()+segments([['all','全部'],['ideas','想法'],['notes','笔记']])+`<div class="hint">将想法留下来。每条内容保存为独立 Markdown 文件。</div>`+(items.length?items.map(n=>`<article class="note" data-note="${n.id}" tabindex="0" role="button"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(n.title)}</h3><span class="badge pending">${n.kind}</span></div><p>${esc(n.summary)}</p><div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="meta">${n.updated} 更新 · Markdown</div></article>`).join(''):'<div class="empty">没有符合条件的知识</div>')}
function markdown(n){return `---\nid: ${n.id}\ntitle: ${n.title}\nkind: ${n.kind==='想法'?'idea':'note'}\ncreated: 2026-10-07\ntags: [${n.tags.join(', ')}]\n---\n\n# ${n.title}\n\n## 原始想法\n\n${n.original}\n\n## 补充与整理\n\n${n.body}\n`}
function noteDetail(n){return `<button class="back" data-back>← 返回知识</button><div><span class="badge pending">${n.kind}</span></div><h2 class="detail-title">${esc(n.title)}</h2><div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="meta">${n.updated} 更新</div><div class="segment" style="margin-top:18px"><button class="${!sourceMode?'active':''}" data-source="false">阅读</button><button class="${sourceMode?'active':''}" data-source="true">Markdown 源文</button></div>${sourceMode?`<pre class="md-source">${esc(markdown(n))}</pre>`:`<div class="markdown"><h3>原始想法</h3><p>${esc(n.original)}</p><h3>补充与整理</h3>${n.body.split('\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div>`}<div class="detail-block"><div class="meta">${esc(n.file)}</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn primary" data-note-todo="${n.id}">生成 Todo</button><button class="btn" data-note-task="${n.id}">创建任务</button><button class="btn" data-ask="${esc(n.title)}">在对话中补充</button><button class="btn" data-download="${n.id}">下载 .md</button></div></div>`}
function render(){const openTodos=todos.filter(t=>t.status==='open').length;$('#tabs').innerHTML=[['tasks','任务',tasks.filter(t=>!['done','cancelled'].includes(t.status)).length],['todos','Todo',openTodos],['notes','知识',notes.length]].map(([id,label,count])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}" aria-selected="${tab===id}">${label}<span class="count">${count}</span></button>`).join('');$('#add').textContent=tab==='tasks'?'＋ 新建任务':tab==='todos'?'＋ 记 Todo':'＋ 记想法';$('#body').innerHTML=detail?(detail.kind==='task'?taskDetail(tasks.find(t=>t.id===detail.id)):noteDetail(notes.find(n=>n.id===detail.id))):tab==='tasks'?taskList():tab==='todos'?todoList():noteList();let total=matched(tasks).filter(t=>view==='history'?['done','cancelled'].includes(t.status):!['done','cancelled'].includes(t.status)).length;$('#footer').innerHTML=tab==='tasks'&&!detail&&view!=='overview'?`<span>共 ${total} 项 · 每页 3 项</span><div class="paging"><button data-page="-1" ${page===1?'disabled':''}>‹</button><span>${page} / ${Math.max(1,Math.ceil(total/3))}</span><button data-page="1" ${page>=Math.ceil(total/3)?'disabled':''}>›</button></div>`:`<span>${detail?'详情':tab==='tasks'?'任务独立保存':tab==='todos'?'Todo 独立保存':'Markdown 知识库'}</span><span>${tab==='tasks'?'会话关联可追溯':tab==='todos'?`${openTodos} 项未完成`:`${notes.length} 篇内容`}</span>`;bindSearch()}
function renderMain(){if(session){const t=tasks.find(t=>t.id===session.task),e=t.executions.find(e=>e.id===session.id);$('#main').innerHTML=`<header class="main-head"><div><div class="eyebrow">任务执行会话 · 示例</div><h2>${esc(session.child||t.title)}</h2></div><button class="btn" data-return>返回个人助理</button></header><div class="linked-banner"><span>关联任务 ${t.id.toUpperCase()}</span>${badge(t.status)}<button class="text-button" data-task="${t.id}" style="margin-left:auto">查看任务详情 →</button></div><div class="chat"><div class="message user"><p>${esc(t.goal)}</p></div><div class="message"><div class="avatar-label">${esc(e?.engine||t.engine)} · ${esc(e?.model||t.model)}</div><p>${esc(session.child?'这项子任务的执行记录在这里展示，任务关联由应用维护。':t.summary)}</p><div class="main-task-card"><span class="muted">任务操作</span><p style="margin-top:8px">可在执行会话中报告进展、提交成果；任务列表同步更新。</p><button class="btn" data-progress="${t.id}">模拟报告进展</button> <button class="btn primary" data-report="${t.id}">模拟提交成果</button></div></div></div><div class="composer"><textarea placeholder="继续讨论这个任务…" aria-label="执行会话消息"></textarea><div class="composer-foot"><span>${esc(t.project)} · 会话 ${esc(session.id)}</span><button class="send" aria-label="发送示例消息" data-send>↑</button></div></div>`;return}$('#main').innerHTML=`<header class="main-head"><div><div class="eyebrow">固定工作目录 · 全局会话</div><h2>个人助理</h2></div><span class="nav-status">● 已就绪</span></header><div class="chat"><div class="chat-intro"><h2>把想法变成行动</h2><p class="muted">安排工作、记下待办，留下值得保留的想法。</p></div><div class="message user"><p>在 harness 项目里创建一个任务，用 Claude 和 DeepSeek Flash 完善个人助理的任务执行闭环。</p></div><div class="message"><div class="avatar-label">个人助理</div><p>任务已经创建，并拆成三个子任务。会话关联梳理已完成，当前正在接入进展与成果回传。</p><p>你可以从右侧进入正在执行的会话，查看完整过程。成果提交后会放到“等待确认”，由你决定是否完成。</p><button class="chat-link" data-task="t1">查看任务 · 完善个人助理的任务执行闭环 →</button></div><div class="message user"><p>再记一个 Todo：设计每周总结。先保存，不执行。</p></div><div class="message"><div class="avatar-label">个人助理</div><p>已记录。准备执行时，可以在右侧 Todo 中转换为任务，再选择项目 function bindSearch(){const input=$('#search');if(input)input.oninput=()=>{const position=input.selectionStart;query=input.value;page=1;render();$('#search').focus();$('#search').setSelectionRange(position,position)}}
function openTask(id){tab='tasks';detail={kind:'task',id};query='';render()}
function openSession(id,task,child){const owner=tasks.find(t=>t.id===task);child=child||owner.children.find(c=>c.session===id)?.title;session={id,task,child};renderMain();toast('已进入对应执行会话（原型演示）')}
function modal(kind,source){const isTask=kind==='task'||kind==='convert'||kind==='note-task',title=kind==='convert'?'将 Todo 转为任务':kind==='note-task'?'从想法创建任务':isTask?'新建任务':kind==='todo'?'记一个 Todo':'保存个人想法';const sourceItem=kind==='convert'?todos.find(t=>t.id===source):kind==='note-task'?notes.find(n=>n.id===source):null;$('#overlays').innerHTML=`<div class="modal-layer" id="modalLayer"><form class="modal" id="form"><h2>${title}</h2><p class="muted" style="font-size:12px">${isTask?'先明确目标，再决定何时执行。':'快速记录，稍后继续补充。'}</p><label class="form-field">${isTask?'任务名称':'标题'}<input name="title" required maxlength="200" value="${esc(sourceItem?.title||'')}" placeholder="想要做什么？"></label><label class="form-field">${isTask?'目标与说明':'内容'}<textarea name="description" rows="3" placeholder="补充背景或要求…">${esc(sourceItem?.summary||'')}</textarea></label>${isTask?`<label class="form-field">项目<select name="project"><option>deepseek-harness</option><option>personal-site</option></select></label><div class="form-pair"><label class="form-field">引擎<select name="engine" id="engine"><option>Claude</option><option>Codex</option><option>Native</option></select></label><label class="form-field">厂商 / 模型<select name="model" id="model"><option value="deepseek-v4-flash">DeepSeek / deepseek-v4-flash</option></select></label></div><div class="hint">示例选项仅演示配置呈现。实际由模型根据可用目录选择，Host 校验兼容性。</div>`:''}${kind==='convert'?'<p class="muted" style="font-size:11px">原 Todo 将保留，并关联新任务；转换不会表示工作已完成。</p>':''}<div class="modal-actions"><button class="btn" type="button" data-close>取消</button><button class="btn ${isTask?'':'solid'}" type="submit" name="action" value="save">${isTask?'保存待执行':'保存'}</button>${isTask?'<button class="btn solid" type="submit" name="action" value="start">创建并启动</button>':''}</div></form></div>`;$('#form input').focus();$('#modalLayer').onclick=e=>{if(e.target===$('#modalLayer'))$('#overlays').innerHTML=''};if($('#engine'))$('#engine').onchange=e=>{$('#model').innerHTML=e.target.value==='Codex'?'<option value="gpt-5.4">OpenAI / gpt-5.4</option>':'<option value="deepseek-v4-flash">DeepSeek / deepseek-v4-flash</option>'};$('#form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target),name=data.get('title').trim();if(!name)return;const description=data.get('description').trim();if(isTask){const id='t'+Date.now(),start=e.submitter?.value==='start',model=data.get('model');tasks.unshift({id,title:name,goal:description||name,criteria:'完成后提交成果，由用户确认。',summary:description||'任务已创建，等待执行。',project:data.get('project'),engine:data.get('engine'),provider:model.startsWith('gpt')?'OpenAI':'DeepSeek',model,status:start?'running':'pending',updated:'刚刚',children:[],executions:start?[{id:'s'+Date.now(),label:'第 1 次执行',status:'running',start:'刚刚',end:'—',engine:data.get('engine'),model}]:[]});if(kind==='convert'){sourceItem.status='converted';sourceItem.taskId=id}tab='tasks';view='overview';detail={kind:'task',id};toast(start?'任务已创建并启动（演示）':'任务已保存为待执行（演示）')}else if(kind==='todo'){todos.unshift({id:'d'+Date.now(),title:name,tag:'未分类',due:'未设置日期',status:'open'});tab='todos';view='open';detail=null;toast('Todo 已记录（演示）')}else{const id='n'+Date.now();notes.unshift({id,title:name,kind:'想法',tags:['未分类'],updated:'刚刚',file:`ideas/${id}.md`,summary:description||name,original:description||name,body:'后续补充与整理可以保存在这里。'});tab='notes';detail={kind:'note',id};sourceMode=false;toast('想法已保存（演示，可下载 Markdown）')}query='';$('#overlays').innerHTML='';render()}}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-note]');if(!b)return;if(b.dataset.tab)changeTab(b.dataset.tab);else if(b.dataset.view){view=b.dataset.view;detail=null;page=1;render()}else if(b.hasAttribute('data-back')){detail=null;render()}else if(b.dataset.task)openTask(b.dataset.task);else if(b.dataset.note){detail={kind:'note',id:b.dataset.note};sourceMode=false;render()}else if(b.dataset.collapse){collapsed.has(b.dataset.collapse)?collapsed.delete(b.dataset.collapse):collapsed.add(b.dataset.collapse);render()}else if(b.dataset.session)openSession(b.dataset.session,b.dataset.taskOwner,b.dataset.child);else if(b.dataset.convert)modal('convert',b.dataset.convert);else if(b.dataset.confirm){const t=tasks.find(t=>t.id===b.dataset.confirm);const awaiting=t.children.filter(c=>c.status==='review');awaiting.forEach(c=>c.status='done');if(awaiting.length){t.children.forEach(c=>{if(c.dependency)c.dependency=undefined});t.status=t.children.every(c=>c.status==='done')?'done':t.children.some(c=>c.status==='running')?'running':'pending';t.summary=t.status==='done'?'全部子任务已完成并确认。':'当前子任务已确认，后续子任务可以启动。'}else t.status='done';t.updated='刚刚';t.executions.forEach(e=>{if(e.status==='review')e.status='done'});render();if(session)renderMain();toast(awaiting.length?'子任务成果已确认，后续任务已就绪（演示）':'任务已由用户确认完成（演示）')}else if(b.dataset.startChild){const t=tasks.find(t=>t.id===b.dataset.startChild),c=t.children.find(c=>c.title===b.dataset.childTitle);c.status='running';c.session='s'+Date.now();t.status='running';t.summary='正在执行：'+c.title;t.executions.unshift({id:c.session,label:'子任务 · '+c.title,status:'running',start:'刚刚',end:'—',engine:t.engine,model:t.model});render();toast('子任务已启动（演示）')}else if(b.dataset.start){const t=tasks.find(t=>t.id===b.dataset.start);t.status='running';t.updated='刚刚';t.executions.unshift({id:'s'+Date.now(),label:'第 1 次执行',status:'running',start:'刚刚',end:'—',engine:t.engine,model:t.model});render();toast('任务已启动，执行会话入口已生成（演示）')}else if(b.dataset.page){page+=Number(b.dataset.page);render()}else if(b.hasAttribute('data-return')){session=null;renderMain()}else if(b.hasAttribute('data-close'))$('#overlays').innerHTML='';else if(b.dataset.source){sourceMode=b.dataset.source==='true';render()}else if(b.dataset.noteTodo){const n=notes.find(n=>n.id===b.dataset.noteTodo);todos.unshift({id:'d'+Date.now(),title:n.title,tag:'来自想法',due:'未设置日期',status:'open',noteId:n.id});changeTab('todos');toast('已根据想法生成 Todo（演示）')}else if(b.dataset.noteTask)modal('note-task',b.dataset.noteTask);else if(b.dataset.download){const n=notes.find(n=>n.id===b.dataset.download),blob=new Blob([markdown(n)],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=n.file.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(b.dataset.ask){session=null;renderMain();$('#draft').value=`关于「${b.dataset.ask}」，`;$('#draft').focus();toast('引用已加入对话草稿，尚未发送')}else if(b.dataset.progress)toast('进展已回传至任务记录（演示）');else if(b.dataset.report){const t=tasks.find(t=>t.id===b.dataset.report);const child=t.children.find(c=>c.session===session?.id);if(child)child.status='review';t.status='review';t.summary=child?'子任务成果已提交：'+child.title:'成果已提交，请查看执行会话并确认结果。';const run=t.executions.find(e=>e.id===session?.id);if(run){run.status='review';run.end='刚刚'}render();renderMain();toast('成果已提交，任务进入等待确认（演示）')}else if(b.hasAttribute('data-send'))toast('此页面为交互原型，不会调用模型')});
document.addEventListener('change',e=>{if(e.target.dataset.check){const t=todos.find(t=>t.id===e.target.dataset.check);t.status=e.target.checked?'done':'open';render();toast(t.status==='done'?'Todo 已标记完成（演示）':'Todo 已恢复为未完成（演示）')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlays').innerHTML='';if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-note')){e.preventDefault();e.target.click()}});
$('#add').onclick=()=>modal(tab==='tasks'?'task':tab==='todos'?'todo':'note');$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').textContent=dark?'浅色预览':'深色预览'};$('#width').oninput=e=>{document.documentElement.style.setProperty('--panel-width',e.target.value+'px');$('#widthValue').textContent=e.target.value};$('#reset').onclick=()=>{reset();toast('示例数据已重置')};reset();
</script>
</body></html>
